title: table ops_credentials
desc: "凭证表"
author: automated export
version: "1.0"
fields:
  - field: id
    note: "ID"
    range: "1-10000"
  - field: spaceID
    note: "空间ID"
    range: "0,1,2,3"
  - field: repoID
    note: "仓库ID"
    range: "0"
  - field: owner
    note: "关联用户账号"
    range: "admin,user1,user2"
  - field: name
    note: "名称"
    range: "admin@laptop,user1@mac,user2@ci"
  - field: identifier
    note: "凭证唯一标识"
    range: "key-admin,key-user1,key-user2"
  - field: type
    note: "凭证类型 ssh|secret"
    range: "ssh"
  - field: secret
    note: "内容"
    range: "ssh-rsa-AAAAB3NzaC1yc2EAAAADAQABAAABAQD1,ssh-ed25519-AAAAC3NzaC1lZDI1NTE5AAAAI2,ecdsa-sha2-nistp256-AAAAE2VjZHNhLXNoYTIt"
  - field: algorithm
    note: "算法类型"
    range: "ssh-rsa,ssh-ed25519,ecdsa-sha2-nistp256"
  - field: fingerprint
    note: "公钥指纹"
    range: "SHA256_admin,SHA256_user1,SHA256_user2"
  - field: desc
    note: "详情"
    range: ''
  - field: verifiedDate
    note: "验证时间"
    range: "(M)-(w)"
    type: "timestamp"
    format: "YYYY-MM-DD hh:mm:ss"
  - field: createdBy
    note: "由谁创建"
    range: "admin,user1,user2"
  - field: createdDate
    note: "创建时间"
    range: "(M)-(w)"
    type: "timestamp"
    format: "YYYY-MM-DD hh:mm:ss"
  - field: editedBy
    note: "由谁编辑"
    range: "admin,user1,user2"
  - field: editedDate
    note: "编辑时间"
    range: "(M)-(w)"
    type: "timestamp"
    format: "YYYY-MM-DD hh:mm:ss"
  - field: deleted
    note: "是否删除"
    range: "0"
